<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Music</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
header { background-color: #f8f9fa; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; }
.menu-icon { font-size: 24px; cursor: pointer; }
.home-icon { font-size: 24px; cursor: pointer; margin-left: 15px; }
.search-container { flex-grow: 1; margin: 0 20px; }
input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
.notification-icon { font-size: 24px; cursor: pointer; }
.styles-container { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; }
.style-circle { width: 100px; height: 100px; background-color: #9d0f19; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 15px; cursor: pointer; font-weight: bold; text-align: center; }
</style>
</head>
<body>
<header>
<div class="menu-icon">☰</div>
<div class="home-icon">⌂</div>
<div class="search-container">
<input type="text" placeholder="Pesquisar...">
</div>
<div class="notification-icon">🔔</div>
</header>
<main>
<div class="styles-container">
<div class="style-circle">Hip-Hop</div>
<div class="style-circle">Marrabenta</div>
<div class="style-circle">R&B</div>
</div>
</main>
</body>
</html>
